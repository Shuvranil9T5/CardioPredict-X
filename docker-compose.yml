services:
  api:
    build: .
    ports: ['8000:8000']
    volumes: ['./artifacts:/app/artifacts']
  dashboard:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0
    environment:
      API_URL: http://api:8000
    ports: ['8501:8501']
    volumes: ['./artifacts:/app/artifacts']
